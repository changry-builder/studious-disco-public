<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d3a6e" />
<title>Roll Call</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-screen="home">
<header class="bar">
  <div class="bar-top">
    <h1 class="brand"><a href="#" id="home-link" aria-label="Roll Call: all games">Roll&nbsp;Call</a></h1>
    <button type="button" class="hint-toggle" id="hints" aria-pressed="false" disabled>Hints</button>
    <div class="stats">
      <span class="score" id="score">0/45</span>
      <span class="clock" id="clock">10:00</span>
    </div>
  </div>
  <form class="entry" id="entry" autocomplete="off">
    <input id="guess" type="text" inputmode="text" enterkeyhint="done"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="Press Start to play" aria-label="Type a name" disabled />
    <span class="say-note" id="say-note">Press Start when you're both ready</span>
    <button type="button" class="btn primary" id="action">Start</button>
  </form>
  <p class="feedback" id="feedback" aria-live="polite"></p>
</header>

<main class="scroller" id="scroller">
<div class="wrap">
  <section class="home" id="home">
    <h2>Pick a game</h2>
    <ul class="game-list" id="game-list"></ul>
  </section>
  <section class="intro" id="intro">
    <h2 id="prompt"></h2>
    <div id="instructions"></div>
    <div class="timepick">
      <label for="minutes">Time limit</label>
      <div class="stepper">
        <button type="button" id="less" aria-label="Less time">−</button>
        <input id="minutes" type="number" inputmode="numeric" min="1" max="60" step="1" value="10" />
        <button type="button" id="more" aria-label="More time">+</button>
      </div>
      <span>min</span>
    </div>
    <p class="best" id="best"></p>
  </section>
  <ol class="board" id="board"></ol>
</div>
</main>

<div class="sheet" id="results" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="results-title">
    <h2 id="results-title">Time's up</h2>
    <p class="big" id="results-score"></p>
    <p id="results-detail"></p>
    <p class="legend" id="results-legend">
      <span class="key found"></span>On your own
      <span class="key assisted"></span>With a hint
      <span class="key missed"></span>Missed
    </p>
    <p class="best" id="results-best"></p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="review">See answers</button>
      <button type="button" class="btn primary" id="again">Play again</button>
    </div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/quizzes/presidents.js"></script>
<script src="js/quizzes/bill-of-rights.js"></script>
<script src="js/app.js"></script>
</body>
</html>
