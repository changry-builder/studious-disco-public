<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Depth Chart</title>
<meta name="description" content="Rosters and depth charts on the field: New York Mets and UCLA Bruins basketball." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="top">
  <h1>Depth Chart</h1>
  <div class="actions">
    <button type="button" class="btn primary" id="add-btn">+ Add player</button>
    <button type="button" class="btn" id="refresh-btn">↻ Refresh from web</button>
    <button type="button" class="btn" id="save-btn">⤓ Save / restore</button>
    <button type="button" class="btn ghost" id="reset-btn">Reset changes</button>
  </div>
</header>
<nav id="controls" class="controls"></nav>
<main class="layout">
  <div class="summary" id="summary"></div>
  <div class="board">
    <div id="field" class="field"></div>
    <aside id="side" class="side"></aside>
    <section id="il" class="il-panel" aria-label="Injured list"></section>
  </div>
  <aside id="roster" class="roster"></aside>
  <section id="table" class="table"></section>
</main>
<footer class="foot">
  Rosters are a best-effort snapshot (Mets: 2026 Opening Day; UCLA: 2025-26). Hover a name for free agency or class. Your edits are saved in this browser and kept through site updates; use Save / restore to back them up.
</footer>
<div id="tip" class="tip" role="tooltip" hidden></div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>
<script src="js/config.js"></script>
<script src="js/data-mets.js"></script>
<script src="js/data-ucla.js"></script>
<script src="js/model.js"></script>
<script src="js/fields.js"></script>
<script src="js/app.js"></script>
</body>
</html>
