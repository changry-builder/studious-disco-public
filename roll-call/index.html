<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d3a6e" />
<title>Roll Call</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="bar">
  <div class="bar-top">
    <h1 class="brand">Roll&nbsp;Call</h1>
    <div class="stats">
      <span class="score" id="score">0/45</span>
      <span class="clock" id="clock">10:00</span>
    </div>
  </div>
  <form class="entry" id="entry" autocomplete="off">
    <input id="guess" type="text" inputmode="text" enterkeyhint="done"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="Press Start to play" aria-label="Type a name" disabled />
    <button type="button" class="btn primary" id="action">Start</button>
  </form>
  <p class="feedback" id="feedback" aria-live="polite"></p>
</header>

<main class="scroller" id="scroller">
<div class="wrap">
  <section class="intro" id="intro">
    <h2 id="prompt">Name every US president</h2>
    <p>Type a name and it fills in as soon as it's right. No need to press Enter.
      Surnames are enough: “Bush” fills in both Bushes. Press Enter to try a misspelled name.</p>
    <p class="best" id="best"></p>
  </section>
  <ol class="board" id="board"></ol>
</div>
</main>

<div class="sheet" id="results" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="results-title">
    <h2 id="results-title">Time's up</h2>
    <p class="big" id="results-score"></p>
    <p id="results-detail"></p>
    <p class="best" id="results-best"></p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="review">See answers</button>
      <button type="button" class="btn primary" id="again">Play again</button>
    </div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/quizzes/presidents.js"></script>
<script src="js/app.js"></script>
</body>
</html>
